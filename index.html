<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaaf Ahmed | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
    --bg-main: #050508;
    --bg-card: rgba(18, 18, 26, 0.7);
    --border-card: rgba(255, 255, 255, 0.08);
    --accent-blue: #3b82f6;
    --accent-cyan: #06b6d4;
    --accent-purple: #8b5cf6;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Background Ambient Glows */
.bg-glow-1, .bg-glow-2 {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
    pointer-events: none;
    opacity: 0.35;
}

.bg-glow-1 {
    top: -50px;
    left: -50px;
    background: radial-gradient(circle, var(--accent-blue), transparent 70%);
}

.bg-glow-2 {
    bottom: -50px;
    right: -50px;
    background: radial-gradient(circle, var(--accent-purple), transparent 70%);
}

/* Portfolio Container */
.portfolio-container {
    width: min(100%, 680px);
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-card);
    border-radius: 32px;
    padding: 40px;
    position: relative;
    z-index: 10;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    animation: fadeInUp 0.8s ease-out;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Header Section */
.profile-header {
    text-align: center;
    margin-bottom: 35px;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    background: rgba(59, 130, 246, 0.1);
    border: 1px solid rgba(59, 130, 246, 0.25);
    border-radius: 50px;
    color: var(--accent-cyan);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 20px;
    animation: pulseBadge 2.5s infinite alternate;
}

@keyframes pulseBadge {
    0% { border-color: rgba(59, 130, 246, 0.25); box-shadow: 0 0 0 rgba(59, 130, 246, 0); }
    100% { border-color: rgba(6, 182, 212, 0.5); box-shadow: 0 0 15px rgba(6, 182, 212, 0.2); }
}

.title {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(34px, 6vw, 48px);
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
}

.subtitle-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    color: var(--accent-cyan);
    font-weight: 600;
}

.subtitle-pill i {
    font-size: 14px;
}

.divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-card), transparent);
    margin: 30px 0;
}

/* Info Grid Section */
.section-title {
    font-family: 'Outfit', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.section-title i {
    color: var(--accent-blue);
}

.grid-cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 35px;
}

@media (max-width: 520px) {
    .grid-cards {
        grid-template-columns: 1fr;
    }
}

.info-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-card);
    border-radius: 20px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.info-card:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(59, 130, 246, 0.4);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
}

.icon-box {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
    border: 1px solid rgba(255, 255, 255, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--accent-cyan);
    flex-shrink: 0;
    transition: all 0.3s ease;
}

.info-card:hover .icon-box {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    color: #ffffff;
    box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
}

.info-details {
    display: flex;
    flex-direction: column;
}

.label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
}

.val {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
}

/* Action Buttons Section */
.actions {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.btn {
    width: 100%;
    padding: 16px;
    border-radius: 18px;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: all 0.3s ease;
    border: 1px solid transparent;
}

.btn-tiktok {
    background: #000000;
    color: #ffffff;
    border-color: rgba(255, 255, 255, 0.15);
}

.btn-tiktok:hover {
    transform: translateY(-3px);
    background: #0f0f15;
    border-color: rgba(255, 255, 255, 0.3);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
}

.btn-whatsapp {
    background: linear-gradient(135deg, #25d366, #128c7e);
    color: #ffffff;
}

.btn-whatsapp:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
}

.btn i {
    font-size: 18px;
}

footer {
    text-align: center;
    margin-top: 30px;
    font-size: 13px;
    color: var(--text-muted);
}
</style>
</head>
<body>

<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<div class="portfolio-container">

    <!-- Header Section -->
    <div class="profile-header">
        <div class="badge">
            <i class="fa-solid fa-sparkles"></i> Welcome to my first website
        </div>
        <h1 class="title">Shaaf Ahmed</h1>
        <div class="subtitle-pill">
            <i class="fa-solid fa-book-quran"></i> Hafiz-e-Quran &nbsp;•&nbsp; Student
        </div>
    </div>

    <div class="divider"></div>

    <!-- Info Section -->
    <div class="section-title">
        <i class="fa-solid fa-user"></i> About Me
    </div>

    <div class="grid-cards">
        <div class="info-card">
            <div class="icon-box"><i class="fa-solid fa-mosque"></i></div>
            <div class="info-details">
                <span class="label">Religion</span>
                <span class="val">Muslim</span>
            </div>
        </div>

        <div class="info-card">
            <div class="icon-box"><i class="fa-solid fa-graduation-cap"></i></div>
            <div class="info-details">
                <span class="label">Education</span>
                <span class="val">1st Year</span>
            </div>
        </div>

        <div class="info-card">
            <div class="icon-box"><i class="fa-solid fa-location-dot"></i></div>
            <div class="info-details">
                <span class="label">Lives In</span>
                <span class="val">Daultala</span>
            </div>
        </div>

        <div class="info-card">
            <div class="icon-box"><i class="fa-solid fa-person-cricket"></i></div>
            <div class="info-details">
                <span class="label">Fav Sport</span>
                <span class="val">Cricket</span>
            </div>
        </div>

        <div class="info-card" style="grid-column: span 2;">
            <div class="icon-box"><i class="fa-solid fa-users"></i></div>
            <div class="info-details">
                <span class="label">Family</span>
                <span class="val">Two Brothers</span>
            </div>
        </div>
    </div>

    <!-- Social & Contact Links -->
    <div class="actions">
        <a href="https://www.tiktok.com/@shaaf_.24" target="_blank" class="btn btn-tiktok">
            <i class="fa-brands fa-tiktok"></i> Follow on TikTok (@shaaf_.24)
        </a>
        <a href="https://wa.me/923476524007" target="_blank" class="btn btn-whatsapp">
            <i class="fa-brands fa-whatsapp"></i> Contact: 03476524007
        </a>
    </div>

    <footer>
        © Shaaf Ahmed • All Rights Reserved
    </footer>

</div>

</body>
</html>
